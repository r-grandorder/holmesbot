name: Refresh servant data

# Weekly (and on demand): re-sync the servant index from Atlas Academy -- NA first,
# then the JP-only remainder -- and commit any change straight to main, which is then
# baked into the image and deployed by watchtower.
#
# This used to open a PR for review, but the r-grandorder org forbids GitHub Actions
# from creating pull requests, so that step failed on every run that actually had data
# (the sync itself always worked). Rather than carry a PAT purely to satisfy a review
# gate that was never exercised, the data commits directly -- it is one JSON file and a
# single revert if a sync ever looks wrong.
#
# Self-correcting: servants that have reached NA graduate into servants.json (and
# out of the *jp pool); new JP-only servants land in servants_jp.json. No manual id
# tracking. Stdlib-only sync, so no AWS/S3 -- unlike the paused refresh-assets.yml.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data
  actions: write # dispatch Build (see the trigger step below)

concurrency: refresh-servant-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-sync servant data (NA, then JP-only)
        run: make sync-data
      - name: Commit refreshed data if it changed
        id: commit
        run: |
          git config user.name "holmesbot-refresh[bot]"
          git config user.email "noreply@holmesbot.com"
          # servants.json is gitignored (rebuilt fresh in the image); only the JP file
          # is committed, so that is all this should ever carry.
          git add data/servants_jp.json
          if git diff --cached --quiet; then
            echo "No servant data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh servant data (scheduled)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger the image build
        # A push made with GITHUB_TOKEN does NOT start another workflow run, so Build
        # would never see this commit if we relied on its `on: push` trigger.
        # workflow_dispatch is one of the two documented exceptions to that rule, so
        # dispatch Build explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
