<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holmes Bot - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=3">
</head>
<body data-page="dashboard">
<div id="topnav"></div>
<header class="page"><h1 id="pagetitle">My stuff</h1></header>
<main>
  <section id="tab-me"></section>
  <section id="tab-boards"></section>
  <section id="tab-wars"></section>
  <section id="tab-raids"></section>
</main>

<div id="raid-editor" class="modal" hidden>
  <div class="modal-card">
    <div id="raid-ed-body"></div>
    <div class="ed-actions">
      <button id="raid-ed-save" class="btn">Save</button>
      <button id="raid-ed-cancel" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<script src="nav.js?v=2"></script>
<script>
// API_BASE + token()/clearToken() come from nav.js.
async function api(path){
  const h = {};
  const t = token();
  if (t) h["Authorization"] = "Bearer " + t;
  const r = await fetch(API_BASE + path, { headers:h });
  if (r.status === 401){ clearToken(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const $ = id => document.getElementById(id);
const authHeaders = () => token() ? {Authorization:"Bearer "+token()} : {};  // for raid fetches outside api()
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n => `<span class="stars">${"★".repeat(n||0)}</span>`;
const prettyClass = s => (s||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\b\w/g,c=>c.toUpperCase());
const num = n => (n==null ? "-" : Number(n).toLocaleString());
const when = s => { if(!s) return "-"; const d = typeof s==="number" ? new Date(s*1000) : new Date(String(s).replace(" ","T")+"Z");
  return isNaN(d) ? esc(s) : d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); };

const SPINNER = `<div class="loading"><div class="spinner"></div><span>Loading…</span></div>`;
const errBox = e => `<div class="errbox">Couldn't load this. ${esc(e.message||e)}</div>`;

function servantCard(s){
  const pct = s.cap ? Math.max(4, Math.min(100, Math.round(s.level/s.cap*100))) : 0;
  const badge = s.active ? `<span class="badge">Active</span>` : "";
  const grails = s.grails_used ? ` &middot; <img class="mini" src="icons/grail.png" alt="grails">${s.grails_used}` : "";
  return `<div class="card ${s.active?"active":""}">
    ${s.face ? `<img src="${esc(s.face)}" alt="" loading="lazy">` : ""}
    <div class="body">
      <div class="name">${esc(s.name)} ${badge}</div>
      <div class="meta">${stars(s.rarity)} ${esc(prettyClass(s.class))}</div>
      <div class="meta">Lv <b>${s.level}</b> / ${s.cap}${grails}</div>
      <div class="lvbar"><span style="width:${pct}%"></span></div>
      <div class="meta">ATK ${num(s.atk)} &middot; HP ${num(s.hp)}</div>
    </div></div>`;
}

async function loadMe(){
  const tab = $("tab-me");
  if (!token()){ tab.innerHTML = `<div class="note">Log in with Discord (top right) to see your inventory and servants.</div>`; return; }
  tab.innerHTML = SPINNER;
  try {
    const [inv, srv, war] = await Promise.all([
      api("/api/me/inventory"), api("/api/me/servants"), api("/api/me/war"),
    ]);
    const items = [
      ["QP", inv.qp, "icons/qp.png"],
      ["Holy Grails", inv.grails, "icons/grail.png"],
      ["Summon Tickets", inv.summon_tickets, "icons/ticket.webp"],
      ["Embers of Wisdom", inv.embers, "icons/ember.png"],
      ["Hellfire of Wisdom", inv.hellfire, "icons/hellfire.png"],
    ];
    const stats = items.map(([k,v,ic]) =>
      `<div class="stat"><img class="ico" src="${ic}" alt=""><div><div class="v">${num(v)}</div><div class="k">${k}</div></div></div>`
    ).join("");
    const warLine = war.in_war
      ? `<div class="warline">Fighting in the war as <b>${esc(war.faction)}</b> &middot; ${num(war.score)} pts contributed</div>` : "";
    const cards = srv.servants.length
      ? `<div class="grid">${srv.servants.map(servantCard).join("")}</div>`
      : `<div class="empty">No contracted servants yet. Use <b>/summon</b> in Discord.</div>`;
    tab.innerHTML = `<div class="h2">Inventory</div><div class="stats">${stats}</div>${warLine}
      <div class="h2">Servants <span class="n">${srv.servants.length}</span></div>${cards}`;
  } catch(e){
    if (String(e).includes("unauthorized")){ location.reload(); return; }
    tab.innerHTML = errBox(e);
  }
}

// ---- leaderboards (sub-tabbed) ----
function loadBoards(){
  const tab = $("tab-boards");
  tab.innerHTML = `
    <div class="subnav">
      <button data-sub="servants" class="on">Top servants</button>
      <button data-sub="qp">Top QP</button>
    </div>
    <div id="board-body"></div>`;
  tab.querySelectorAll(".subnav button").forEach(b => b.onclick = () => {
    tab.querySelectorAll(".subnav button").forEach(x => x.classList.toggle("on", x===b));
    showBoard(b.dataset.sub);
  });
  showBoard("servants");
}
async function showBoard(which){
  const body = $("board-body");
  body.innerHTML = SPINNER;
  try { body.innerHTML = which === "qp" ? await boardQp() : await boardServants(); }
  catch(e){ body.innerHTML = errBox(e); }
}
async function boardServants(){
  const d = await api("/api/leaderboard/servants");
  if (!d.leaderboard.length) return `<div class="empty">No servants on the board yet.</div>`;
  const row = r => `<tr>
    <td class="rankn ${r.rank<=3?"g"+r.rank:""}">${r.rank}</td>
    <td>${esc(r.owner)}</td>
    <td>${r.face?`<img class="face-sm" src="${esc(r.face)}" alt="" loading="lazy">`:""}${esc(r.name)} ${stars(r.rarity)}</td>
    <td class="r">Lv ${r.level}</td></tr>`;
  return `<table class="tbl"><thead><tr><th class="rankn">#</th><th>Owner</th><th>Servant</th><th class="r">Level</th></tr></thead>
    <tbody>${d.leaderboard.map(row).join("")}</tbody></table>`;
}
async function boardQp(){
  const d = await api("/api/leaderboard/qp");
  if (!d.leaderboard.length) return `<div class="empty">No QP earned yet.</div>`;
  const row = r => `<tr>
    <td class="rankn ${r.rank<=3?"g"+r.rank:""}">${r.rank}</td>
    <td>${esc(r.name)}</td>
    <td class="r">${num(r.points)}<img class="inline-ic" src="icons/qp.png" alt="QP"></td>
    <td class="r">${num(r.wins)}</td></tr>`;
  return `<table class="tbl"><thead><tr><th class="rankn">#</th><th>Player</th><th class="r">QP</th><th class="r">Wins</th></tr></thead>
    <tbody>${d.leaderboard.map(row).join("")}</tbody></table>`;
}

// ---- wars ----
async function loadWars(){
  const tab = $("tab-wars");
  tab.innerHTML = SPINNER;
  try {
    const [active, hist] = await Promise.all([api("/api/wars/active"), api("/api/wars/history")]);
    let html = `<div class="h2">Active war</div>`;
    if (active.active){
      const max = Math.max(1, ...active.factions.map(f => f.score||0));
      const facs = active.factions.map((f,i) => `<div class="fac">
        <div class="row fachead" data-fac="${i}">
          <span>${esc(f.name)} <span class="dim">&middot; ${f.members} members <span class="caret">&#9662;</span></span></span>
          <b>${num(f.score)}</b></div>
        <div class="bar"><span style="width:${Math.round((f.score||0)/max*100)}%"></span></div>
        <div class="facroster" id="facroster-${i}" hidden>${
          f.roster && f.roster.length
            ? f.roster.map(m => `<div class="row"><span class="dim">${esc(m.name)}</span><span class="dim">${num(m.score)}</span></div>`).join("")
            : `<div class="dim" style="padding:5px 0">No members yet.</div>`
        }</div></div>`).join("");
      html += `<div class="warcard">
        <img class="warbanner" src="${API_BASE}/api/wars/banner" alt="" onerror="this.remove()">
        <div class="name">${esc(active.name)||"Faction War"}</div>
        ${active.description?`<div class="meta">${esc(active.description)}</div>`:""}
        <div class="meta">Ends ${when(active.ends_at)}</div>${facs}</div>`;
    } else { html += `<div class="empty">No war is currently running.</div>`; }
    html += `<div class="h2">Past wars</div>`;
    html += hist.wars.length ? hist.wars.map(w => `<div class="warcard click" data-war="${w.id}">
      <div class="name">${esc(w.name)||"Faction War"}</div>
      <div class="meta">${when(w.started_at)} &ndash; ${when(w.ended_at)}</div>
      <div id="war-${w.id}"></div></div>`).join("") : `<div class="empty">No past wars yet.</div>`;
    tab.innerHTML = html;
    tab.querySelectorAll(".fachead").forEach(el => el.onclick = () => {
      const r = $("facroster-" + el.dataset.fac);
      r.hidden = !r.hidden;
      el.classList.toggle("open", !r.hidden);
    });
    tab.querySelectorAll(".warcard.click").forEach(el => el.onclick = async () => {
      const box = $("war-" + el.dataset.war);
      if (box.dataset.open){ box.innerHTML = ""; box.dataset.open = ""; return; }
      box.innerHTML = `<div class="loading" style="padding:16px 0"><div class="spinner"></div></div>`;
      try {
        const d = await api("/api/wars/" + el.dataset.war);
        box.innerHTML = d.factions.map(f => `<div class="fac"><div class="row"><b>${esc(f.name)}</b><span>${num(f.score)} pts</span></div>
          ${f.members.map(m => `<div class="row"><span class="dim">${esc(m.name)}</span><span class="dim">${num(m.score)}</span></div>`).join("")}</div>`).join("");
        box.dataset.open = "1";
      } catch(e){ box.innerHTML = errBox(e); }
    });
  } catch(e){ tab.innerHTML = errBox(e); }
}

// ---- Raids (public status/history + mod-only config editor) ----
let RAID_IS_MOD = false, RAID_VOCAB = null;
const medal = r => ({1:"\u{1F947}",2:"\u{1F948}",3:"\u{1F949}"}[r] || (r + "."));

async function loadRaids(){
  const tab = $("tab-raids");
  tab.innerHTML = SPINNER;
  try {
    const [active, hist, me] = await Promise.all([
      fetch(API_BASE+"/api/raids/active").then(r=>r.ok?r.json():{active:false}),
      fetch(API_BASE+"/api/raids/history").then(r=>r.ok?r.json():{raids:[]}),
      token() ? api("/api/me").catch(()=>({})) : {},
    ]);
    RAID_IS_MOD = !!me.is_mod;
    let html = `<div class="h2">Active raid</div>`;
    if (active.active){
      const pct = active.total_hp ? Math.round(active.current_hp/active.total_hp*100) : 0;
      const lb = (active.leaderboard||[]).map(r=>`<div class="row"><span>${medal(r.rank)} ${esc(r.name)}</span><b>${num(r.damage)}</b></div>`).join("");
      html += `<div class="warcard">
        <div class="name">${esc(active.name)||"Raid"}</div>
        ${active.flavor?`<div class="meta">${esc(active.flavor)}</div>`:""}
        <div class="meta">Phase: ${esc(active.phase||"Opening")} &middot; Ends ${when(active.expires_at)}</div>
        <div class="fac"><div class="row"><span>HP</span><b>${num(active.current_hp)} / ${num(active.total_hp)}</b></div>
          <div class="bar"><span style="width:${pct}%"></span></div></div>
        <div style="margin-top:8px">${lb || '<span class="dim">No contributors yet.</span>'}</div></div>`;
    } else {
      html += `<div class="empty">No raid is active right now.</div>`;
    }
    tab.innerHTML = html
      + (RAID_IS_MOD ? `<div class="h2">Raid configs <span class="n">mods</span></div><div id="raid-defs"></div>
           <button id="raid-new" class="btn">+ New raid</button>` : ``)
      + `<div class="h2">Past raids</div>` + histHtml(hist);
    if (RAID_IS_MOD){
      const defs = await fetch(API_BASE+"/api/raids", {headers:authHeaders()}).then(r=>r.json());
      renderRaidDefs(defs.raids||[]);
      $("raid-new").onclick = ()=>openRaidEditor("");
    }
    wirePastRaids(tab, hist);
  } catch(e){ tab.innerHTML = errBox(e); }
}

function histHtml(hist){
  if (!hist.raids || !hist.raids.length) return `<div class="empty">No past raids yet.</div>`;
  return hist.raids.map(r=>`<div class="warcard click" data-raid="${r.id}">
    <div class="name">${esc(r.name)} ${r.status==="defeated"?"\u{1F525}":"⌛"}</div>
    <div class="meta">${when(r.ended_at)}</div>
    <div id="rhist-${r.id}" hidden></div></div>`).join("");
}
function wirePastRaids(tab, hist){
  const byId = {}; (hist.raids||[]).forEach(r=>byId[r.id]=r);
  tab.querySelectorAll(".warcard.click[data-raid]").forEach(el=>el.onclick=()=>{
    const box = $("rhist-"+el.dataset.raid);
    if (box.dataset.open){ box.hidden=true; box.dataset.open=""; return; }
    const r = byId[el.dataset.raid] || {};
    box.innerHTML = (r.leaderboard||[]).map(x=>`<div class="row"><span class="dim">${medal(x.rank)} ${esc(x.name)}</span><span class="dim">${num(x.damage)}</span></div>`).join("") || '<span class="dim">No contributors.</span>';
    box.hidden=false; box.dataset.open="1";
  });
}

function renderRaidDefs(defs){
  const el = $("raid-defs");
  if (!defs.length){ el.innerHTML = `<div class="empty">No raids configured yet.</div>`; return; }
  el.innerHTML = defs.map(d=>`<div class="card"><div class="body">
    <div class="name">${esc(d.display_name)} <span class="dim">(${esc(d.name)})</span> ${d.running?'<span class="badge">Live</span>':''}</div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="editbtn" data-edit="${esc(d.name)}">Edit</button>
      <button class="editbtn" data-dup="${esc(d.name)}">Duplicate</button>
      <button class="editbtn" data-toggle="${esc(d.name)}" data-on="${d.running?1:0}">${d.running?"End raid":"Start raid"}</button>
    </div></div></div>`).join("");
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openRaidEditor(b.dataset.edit));
  el.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>openRaidEditor(b.dataset.dup, {duplicate:true}));
  el.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleRaid(b.dataset.toggle, b.dataset.on!=="1"));
}
async function toggleRaid(name, on){
  try {
    const r = await fetch(API_BASE+"/api/raids/"+encodeURIComponent(name)+"/enable", {
      method:"POST", headers:{...authHeaders(),"Content-Type":"application/json"}, body:JSON.stringify({enabled:on})});
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.ok){ alert("Failed: "+((d.errors||[]).join("; ")||("HTTP "+r.status))); return; }
    loadRaids();
  } catch(e){ alert("Error: "+e.message); }
}

// ---- raid editor ----
const selTag = (v, sel) => `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(prettyClass(v))}</option>`;
// What the "Value" field means per effect type (its meaning is effect-specific), shown as a live hint.
const EFFECT_VALUE_HELP = {
  attack_up:"+% ATK (0.5 = +50%)", attack_down:"-% ATK (0.3 = -30%)",
  defense_up:"% less damage taken (0.5 = takes 50% less)", defense_down:"% more damage taken (0.5 = takes 50% more)",
  atk_up_on_damage:"ATK +% gained when it deals damage (0.2 = +20%)",
  atk_up_on_hurt:"ATK +% gained when it's attacked, even if it evades the hit (0.2 = +20%)",
  atk_up_on_kill:"ATK +% gained on a kill (0.2 = +20%)",
  def_up_on_kill:"DEF +% gained on a kill (0.2 = +20%)",
  poison:"damage per turn: <=1 = fraction of max HP (0.1 = 10%/turn); >1 = flat (e.g. 3000)",
  healing_per_turn:"if <=1, fraction of max HP healed per turn (0.1 = 10%); if >1, flat HP/turn",
  max_hp_up:"fraction of max HP added (0.2 = +20%); a large number = flat HP",
  heal:"flat HP restored (instant)", heal_on_damage:"flat HP healed each time it deals damage",
  curse:"damage per turn: <=1 = fraction of max HP (0.1 = 10%); >1 = flat (e.g. 3000)",
  burn:"damage per turn: <=1 = fraction of max HP; >1 = flat (also -10% the burned unit's ATK)",
  guts:"number of revives (each brings it back at 1 HP)",
  instant_kill:"chance to instantly kill on hit, 0 to 1 (0.3 = 30%)",
  piercing:"fraction of damage that also hits the back line (0.5 = 50%)",
  order_change:"-1 = move to back, 1 = move to front, 0 = swap with an ally",
  skill_seal_resist:"chance to resist skill seal, 0 to 1 (0.8 = 80%)",
};
const EFFECT_NO_VALUE = new Set(["evade","anti_purge","ignore_evade","guts_pierce","pass_buffs",
  "cleanse","curse_immunity","stun","sleep","skill_seal","sacrifice","buff_removal"]);
function effHintText(type){
  const v = EFFECT_VALUE_HELP[type] || (EFFECT_NO_VALUE.has(type)
            ? "not used by this effect (leave it as is)" : "depends on this effect");
  return `Value = ${v}. Duration = turns active (-1 = permanent, 1 = this turn only).`;
}
function raidEffRow(e){
  e = e || {effect_type:RAID_VOCAB.effect_types[0], value:1, duration:-1, target:"self"};
  return `<div class="effitem"><div class="effrow">
    <label class="ecell">Effect<select class="e-type">${RAID_VOCAB.effect_types.map(t=>selTag(t,e.effect_type)).join("")}</select></label>
    <label class="ecell">Value<input class="e-val" type="number" step="any" value="${e.value}"></label>
    <label class="ecell">Duration<input class="e-dur" type="number" step="1" value="${e.duration}" title="-1 = permanent"></label>
    <label class="ecell">Target<select class="e-tgt">${RAID_VOCAB.targets.map(t=>selTag(t,e.target)).join("")}</select></label>
    <label class="e-unrem"><input type="checkbox" ${e.unremovable?"checked":""}> unrem</label>
    <button class="e-del">&times;</button></div>
    <div class="effhint">${effHintText(e.effect_type)}</div></div>`;
}
function spriteSlot(key, id){
  const url = id ? API_BASE+"/api/raids/sprite/"+id : "";
  return `<div class="fld">Sprite (optional upload)
    <input type="hidden" class="sprite-id" data-key="${key}" value="${id||""}">
    <input type="file" accept="image/*" class="sprite-file" data-key="${key}">
    <img class="sprite-prev" data-key="${key}" src="${url}" height="52" ${id?"":'hidden'}></div>`;
}
function phaseBlock(ph, i){
  ph = ph || {threshold:1.0, name:"", flavor:"", atk_mult:1, kit:null};
  const kit = ph.kit || {name:"", trigger:RAID_VOCAB.triggers[0], effects:[]};
  return `<div class="phase" data-phase="${i}">
    <div class="row"><b>Phase ${i+1}</b><button class="e-del" data-delphase="1">remove</button></div>
    <label class="fld">Enters at HP fraction (0-1)<input class="ph-threshold" type="number" step="0.05" min="0.01" max="1" value="${ph.threshold}"></label>
    <label class="fld">Name<input class="ph-name" value="${esc(ph.name||"")}"></label>
    <label class="fld">Flavor text<input class="ph-flavor" value="${esc(ph.flavor||"")}"></label>
    <label class="fld">ATK multiplier<input class="ph-atk" type="number" step="0.1" value="${ph.atk_mult||1}"></label>
    <label class="fld">Sprite size override (blank = boss size)<input class="ph-scale" type="number" step="0.1" value="${ph.sprite_scale||""}"></label>
    ${spriteSlot("phase-"+i, ph.sprite_id)}
    <label class="fld">Skill name<input class="ph-kit-name" value="${esc(kit.name||"")}"></label>
    <label class="fld">Skill trigger<select class="ph-kit-trigger">${RAID_VOCAB.triggers.map(t=>selTag(t,kit.trigger)).join("")}</select></label>
    <div class="fld">Skill effects</div>
    <div class="ph-effects">${(kit.effects||[]).map(raidEffRow).join("")}</div>
    <button class="ghostbtn ph-addeff">+ Add effect</button></div>`;
}
function rankRow(t){
  t = t || {top:1, qp:0, grails:0, tickets:0, embers:0, hellfire:0};
  return `<div class="rankrow">
    <label class="rwfield">Top N<input class="rk-top" type="number" value="${t.top||1}"></label>
    <label class="rwfield">QP<input class="rk-qp" type="number" value="${t.qp||0}"></label>
    <label class="rwfield">Grails<input class="rk-grails" type="number" value="${t.grails||0}"></label>
    <label class="rwfield">Tickets<input class="rk-tickets" type="number" value="${t.tickets||0}"></label>
    <label class="rwfield">Embers<input class="rk-embers" type="number" value="${t.embers||0}"></label>
    <label class="rwfield">Hellfire<input class="rk-hellfire" type="number" value="${t.hellfire||0}"></label>
    <button class="e-del" title="remove tier">&times;</button></div>`;
}
async function openRaidEditor(name, {duplicate=false}={}){
  const box = $("raid-editor"), body = $("raid-ed-body");
  box.hidden = false; body.innerHTML = SPINNER; $("raid-ed-save").disabled = true;
  try {
    const d = await fetch(API_BASE+"/api/raids/"+encodeURIComponent(name||"_new"), {headers:authHeaders()}).then(r=>r.json());
    RAID_VOCAB = d.vocab;
    const defn = d.def || {display_name:"", boss_servant_id:"", boss_level:120, total_hp:1000000,
      battle_hp:50000, duration_hours:24, phases:[], rewards:{}};
    const rw = defn.rewards || {}, part = rw.participation || {}, lh = rw.last_hit || {};
    // duplicate: load an existing def's settings but as a NEW def (editable, distinct slug), so saving
    // creates a copy and leaves the source untouched. editing: existing def, slug locked.
    const editing = name && !duplicate;
    const slug = editing ? name : (duplicate ? name + "_copy" : "");
    const title = editing ? "Edit raid: " + esc(name)
                : duplicate ? "New raid (copied from " + esc(name) + ")" : "New raid";
    body.innerHTML = `
      <div class="ed-title">${title}</div>
      <label class="fld">Slug / id${editing ? "" : " (lowercase, no spaces)"}<input id="rd-name" value="${esc(slug)}" ${editing?"readonly":""}></label>
      <label class="fld">Display name<input id="rd-display" value="${esc(defn.display_name||"")}"></label>
      <label class="fld">Boss servant id (blank = custom boss)<input id="rd-boss" type="number" value="${esc(defn.boss_servant_id||"")}"></label>
      <label class="fld">Boss ATK (custom boss only; ignored if a servant id is set)<input id="rd-atk" type="number" value="${defn.boss_atk||""}"></label>
      <label class="fld">Boss class (optional, e.g. beast/saber)<input id="rd-class" value="${esc(defn.boss_class||"")}"></label>
      <label class="fld">Boss level<input id="rd-level" type="number" value="${defn.boss_level||120}"></label>
      <label class="fld">Total HP (shared pool)<input id="rd-total" type="number" value="${defn.total_hp||1000000}"></label>
      <label class="fld">Per-battle HP (each fight)<input id="rd-battle" type="number" value="${defn.battle_hp||50000}"></label>
      <label class="fld">Duration (hours)<input id="rd-hours" type="number" value="${defn.duration_hours||24}"></label>
      <label class="fld">Boss size (1 = normal, 1.5 = big, 2.5 = huge)<input id="rd-scale" type="number" step="0.1" value="${defn.boss_scale||1.5}"></label>
      ${spriteSlot("default", defn.default_sprite_id)}
      <div class="ed-note">Raid bosses are always immune to instant-kill and skill-seal, so players cannot one-shot the boss or stop its skill from firing. This is built in and not configurable.</div>
      <div class="h2">Rewards</div>
      <label class="fld">Per-fight QP<input id="rd-perfight" type="number" value="${rw.per_fight_qp||0}"></label>
      <div class="fld">Participation rewards (everyone who dealt damage)</div>
      <div class="rwcol">
        <label class="rwrow"><span>QP</span><input id="rd-part-qp" type="number" value="${part.qp||0}"></label>
        <label class="rwrow"><span>Embers</span><input id="rd-part-em" type="number" value="${part.embers||0}"></label>
        <label class="rwrow"><span>Hellfire</span><input id="rd-part-hf" type="number" value="${part.hellfire||0}"></label>
        <label class="rwrow"><span>Grails</span><input id="rd-part-gr" type="number" value="${part.grails||0}"></label>
        <label class="rwrow"><span>Tickets</span><input id="rd-part-tk" type="number" value="${part.tickets||0}"></label>
      </div>
      <div class="fld">Last-hit rewards (killing-blow bonus)</div>
      <div class="rwcol">
        <label class="rwrow"><span>QP</span><input id="rd-lh-qp" type="number" value="${lh.qp||0}"></label>
        <label class="rwrow"><span>Embers</span><input id="rd-lh-em" type="number" value="${lh.embers||0}"></label>
        <label class="rwrow"><span>Hellfire</span><input id="rd-lh-hf" type="number" value="${lh.hellfire||0}"></label>
        <label class="rwrow"><span>Grails</span><input id="rd-lh-gr" type="number" value="${lh.grails||0}"></label>
        <label class="rwrow"><span>Tickets</span><input id="rd-lh-tk" type="number" value="${lh.tickets||0}"></label>
      </div>
      <div class="fld">Rank tiers (ranked by damage dealt; each tier rewards the top N players)</div>
      <div id="rd-ranks">${(rw.ranks||[]).map(rankRow).join("")}</div>
      <button id="rd-addrank" class="ghostbtn">+ Add rank tier</button>
      <div class="h2">Phases</div>
      <div id="rd-phases">${(defn.phases||[]).map(phaseBlock).join("")}</div>
      <button id="rd-addphase" class="ghostbtn">+ Add phase</button>
      <div id="rd-err" class="ed-err"></div>`;
    $("rd-addphase").onclick = () => { const c=$("rd-phases"); c.insertAdjacentHTML("beforeend", phaseBlock(null, c.children.length)); };
    $("rd-addrank").onclick = () => $("rd-ranks").insertAdjacentHTML("beforeend", rankRow(null));
    $("raid-ed-save").disabled = false;
    $("raid-ed-save").onclick = () => saveRaid();  // always PUTs to the current slug input (upsert)
  } catch(e){ body.innerHTML = `<div class="errbox">Couldn't load raid. ${esc(e.message)}</div>`; }
}
function _spriteId(key){ const el = document.querySelector(`.sprite-id[data-key="${key}"]`); const v = el && el.value; return v ? parseInt(v,10) : undefined; }
function gatherRaidDef(){
  const phases = [...document.querySelectorAll("#rd-phases .phase")].map((p, i) => {
    const eff = [...p.querySelectorAll(".ph-effects .effrow")].map(row => {
      const o = { effect_type: row.querySelector(".e-type").value, value: parseFloat(row.querySelector(".e-val").value),
        duration: parseInt(row.querySelector(".e-dur").value,10), target: row.querySelector(".e-tgt").value };
      if (row.querySelector(".e-unrem input").checked) o.unremovable = true;
      return o;
    });
    const ph = { threshold: parseFloat(p.querySelector(".ph-threshold").value),
      name: p.querySelector(".ph-name").value.trim(), flavor: p.querySelector(".ph-flavor").value.trim(),
      atk_mult: parseFloat(p.querySelector(".ph-atk").value) || 1 };
    const psc = parseFloat(p.querySelector(".ph-scale").value); if (psc > 0) ph.sprite_scale = psc;
    const sEl = p.querySelector(".sprite-id");  // read from within this phase (index-independent)
    if (sEl && sEl.value) ph.sprite_id = parseInt(sEl.value, 10);
    const kitName = p.querySelector(".ph-kit-name").value.trim();
    if (kitName || eff.length) ph.kit = { name: kitName, trigger: p.querySelector(".ph-kit-trigger").value, effects: eff };
    return ph;
  });
  const ranks = [...document.querySelectorAll("#rd-ranks .rankrow")].map(r => {
    const rv = c => parseInt(r.querySelector(c).value,10)||0;
    return { top: parseInt(r.querySelector(".rk-top").value,10), qp: rv(".rk-qp"),
      grails: rv(".rk-grails"), tickets: rv(".rk-tickets"), embers: rv(".rk-embers"), hellfire: rv(".rk-hellfire") };
  });
  const gi = id => parseInt($(id).value,10)||0;
  const def = {
    display_name: $("rd-display").value.trim(),
    boss_level: parseInt($("rd-level").value,10) || 120,
    total_hp: parseInt($("rd-total").value,10),
    battle_hp: parseInt($("rd-battle").value,10),
    duration_hours: parseInt($("rd-hours").value,10),
    boss_scale: parseFloat($("rd-scale").value) || 1.5,
    phases,
    rewards: {
      per_fight_qp: gi("rd-perfight"),
      participation: { qp: gi("rd-part-qp"), embers: gi("rd-part-em"), hellfire: gi("rd-part-hf"), grails: gi("rd-part-gr"), tickets: gi("rd-part-tk") },
      last_hit: { qp: gi("rd-lh-qp"), embers: gi("rd-lh-em"), hellfire: gi("rd-lh-hf"), grails: gi("rd-lh-gr"), tickets: gi("rd-lh-tk") },
      ranks,
    },
  };
  const bsid = parseInt($("rd-boss").value, 10);
  if (Number.isFinite(bsid) && bsid > 0) def.boss_servant_id = bsid;  // else a custom boss
  const batk = parseInt($("rd-atk").value, 10);
  if (Number.isFinite(batk) && batk > 0) def.boss_atk = batk;
  const bcls = $("rd-class").value.trim();
  if (bcls) def.boss_class = bcls;
  const dsid = _spriteId("default"); if (dsid) def.default_sprite_id = dsid;
  return def;
}
async function saveRaid(){
  const name = ($("rd-name").value || "").trim();
  const err = $("rd-err"); err.textContent = "";
  if (!name){ err.textContent = "Slug is required."; return; }
  try {
    const r = await fetch(API_BASE+"/api/raids/"+encodeURIComponent(name), {
      method:"PUT", headers:{...authHeaders(), "Content-Type":"application/json"}, body: JSON.stringify({def: gatherRaidDef()})});
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.ok){ err.textContent = "Rejected: " + ((d.errors||[]).join("; ") || ("HTTP "+r.status)); return; }
    $("raid-editor").hidden = true; loadRaids();
  } catch(e){ err.textContent = "Error: " + e.message; }
}
// delegated modal handlers (bound once; the modal is static in the page)
$("raid-ed-cancel").onclick = () => { $("raid-editor").hidden = true; };
$("raid-editor").addEventListener("click", e => {
  if (e.target.classList.contains("e-del")){
    if (e.target.dataset.delphase) e.target.closest(".phase").remove();
    else e.target.closest(".effitem, .rankrow")?.remove();
  } else if (e.target.classList.contains("ph-addeff")){
    e.target.previousElementSibling.insertAdjacentHTML("beforeend", raidEffRow(null));
  }
});
$("raid-editor").addEventListener("change", async e => {
  if (e.target.classList.contains("e-type")){  // refresh the value/duration explainer for this row
    const hint = e.target.closest(".effitem")?.querySelector(".effhint");
    if (hint) hint.textContent = effHintText(e.target.value);
    return;
  }
  if (!e.target.classList.contains("sprite-file")) return;
  const slot = e.target.closest(".fld"), f = e.target.files[0];  // set the sibling id/preview
  if (!f || !slot) return;
  try {
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch(API_BASE+"/api/raids/sprite", {method:"POST", headers:authHeaders(), body:fd});
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error((d.errors||["upload failed"]).join("; "));
    slot.querySelector(".sprite-id").value = d.id;
    const prev = slot.querySelector(".sprite-prev");
    prev.src = API_BASE+"/api/raids/sprite/"+d.id; prev.hidden = false;
  } catch(err){ alert("Sprite upload failed: " + err.message); }
});

// ---- hash-routed tabs (nav lives in the shared top nav) ----
const loaders = { me:loadMe, boards:loadBoards, wars:loadWars, raids:loadRaids };
const titles = { me:"My stuff", boards:"Leaderboards", wars:"Wars", raids:"Raids" };
const loaded = {};
function currentTab(){ const h = location.hash.replace(/^#/,""); return ["me","boards","wars","raids"].includes(h) ? h : "me"; }
function show(tab){
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("on", s.id === "tab-"+tab));
  document.querySelectorAll(".mainnav a").forEach(a => a.classList.toggle("active", a.dataset.nav === tab));
  $("pagetitle").textContent = titles[tab];
  if (!loaded[tab]){ loaded[tab] = 1; loaders[tab](); }
}
addEventListener("hashchange", () => show(currentTab()));
show(currentTab());
</script>
