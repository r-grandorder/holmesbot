<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holmes Bot - Dashboard</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --acc:#5b8cff; --gold:#e3b341; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 16px 8px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; }
  .sub { color:var(--dim); font-size:13px; }
  #auth { margin-left:auto; font-size:13px; color:var(--dim); display:flex; gap:10px; align-items:center; }
  a.btn, button.btn { background:var(--acc); color:#fff; border:none; border-radius:6px; padding:7px 12px;
    font-size:13px; text-decoration:none; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; font-size:13px; cursor:pointer; }
  nav { display:flex; gap:4px; padding:8px 16px; border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  nav button { background:none; border:none; color:var(--dim); padding:8px 12px; font-size:14px; cursor:pointer;
    border-bottom:2px solid transparent; }
  nav button.on { color:var(--text); border-bottom-color:var(--acc); }
  main { padding:16px; }
  section { display:none; }
  section.on { display:block; }
  h2 { font-size:15px; margin:18px 0 8px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .chips { display:flex; gap:10px; flex-wrap:wrap; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:96px; }
  .chip .k { color:var(--dim); font-size:12px; }
  .chip .v { font-size:20px; font-weight:700; margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; gap:12px; }
  .card img { width:56px; height:56px; border-radius:8px; object-fit:cover; background:#222; flex:none; }
  .card .body { min-width:0; flex:1; }
  .name { font-weight:600; }
  .badge { font-size:11px; color:#fff; background:var(--acc); border-radius:4px; padding:1px 6px; margin-left:6px; }
  .meta { color:var(--dim); font-size:12px; margin:2px 0; }
  .stars { color:var(--gold); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.r, th.r { text-align:right; }
  .rank { color:var(--dim); width:32px; }
  .warcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; }
  .warcard.click { cursor:pointer; }
  .fbar { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
  .dim { color:var(--dim); }
  .empty { padding:30px 4px; color:var(--dim); }
  .note { padding:40px 16px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Holmes Bot</h1>
  <span class="sub">Dashboard</span>
  <div id="auth"></div>
</header>
<nav>
  <button data-tab="me" class="on">My stuff</button>
  <button data-tab="boards">Leaderboards</button>
  <button data-tab="wars">Wars</button>
</nav>
<main>
  <section id="tab-me" class="on"></section>
  <section id="tab-boards"></section>
  <section id="tab-wars"></section>
</main>

<script>
// ---- CONFIG: set this to your API's public URL (the Cloudflare Tunnel hostname), no trailing slash.
const API_BASE = "https://REPLACE-ME.example";  // e.g. https://api.holmesbot.pages... (your tunnel)

// ---- token (bearer, kept in localStorage) ----
const TK = "holmesbot_token";
function getToken(){ return localStorage.getItem(TK); }
function setToken(t){ localStorage.setItem(TK, t); }
function clearToken(){ localStorage.removeItem(TK); }
// Capture the token handed back in the URL fragment after Discord login, then clean the URL.
(function(){
  const m = location.hash.match(/token=([^&]+)/);
  if (m){ setToken(decodeURIComponent(m[1])); history.replaceState(null,"",location.pathname); }
})();

async function api(path){
  const h = {};
  const t = getToken();
  if (t) h["Authorization"] = "Bearer "+t;
  const r = await fetch(API_BASE+path, { headers:h });
  if (r.status === 401){ clearToken(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error("http "+r.status);
  return r.json();
}

const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = n => n==null ? "" : `<span class="stars">${"★".repeat(n)}</span>`;
const prettyClass = s => (s||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\b\w/g,c=>c.toUpperCase());
const num = n => (n==null? "-" : Number(n).toLocaleString());
const when = s => { if(!s) return "-"; const d = typeof s==="number"? new Date(s*1000): new Date(s.replace(" ","T")+"Z");
  return isNaN(d)? esc(s) : d.toLocaleDateString(); };

function servantCard(s){
  const active = s.active ? `<span class="badge">Active</span>` : "";
  return `<div class="card">
    ${s.face?`<img loading="lazy" src="${esc(s.face)}" alt="">`:""}
    <div class="body">
      <div class="name">${esc(s.name)}${active}</div>
      <div class="meta">${stars(s.rarity)} ${esc(prettyClass(s.class))}</div>
      <div class="meta">Lv ${s.level} / ${s.cap}${s.grails_used?` &middot; ${s.grails_used} grails`:""}</div>
      <div class="meta">ATK ${num(s.atk)} &middot; HP ${num(s.hp)}</div>
    </div></div>`;
}

// ---- renderers ----
function renderAuth(meData){
  const el = $("auth");
  if (meData){
    el.innerHTML = `Signed in as <b>${esc(meData.name)}</b> <button class="ghost" id="logout">Log out</button>`;
    $("logout").onclick = ()=>{ clearToken(); location.reload(); };
  } else {
    el.innerHTML = `<a class="btn" href="${API_BASE}/api/auth/login">Login with Discord</a>`;
  }
}

async function loadMe(){
  const tab = $("tab-me");
  if (!getToken()){ tab.innerHTML = `<div class="note">Log in with Discord to see your inventory and servants.</div>`; renderAuth(null); return; }
  try {
    const [me, inv, srv, war] = await Promise.all([
      api("/api/me"), api("/api/me/inventory"), api("/api/me/servants"), api("/api/me/war")
    ]);
    renderAuth(me);
    const chips = [["QP",inv.qp],["Grails",inv.grails],["Summon Tickets",inv.summon_tickets],
      ["Embers",inv.embers],["Hellfire",inv.hellfire]]
      .map(([k,v])=>`<div class="chip"><div class="k">${k}</div><div class="v">${num(v)}</div></div>`).join("");
    const warLine = war.in_war
      ? `<div class="meta">In war as <b>${esc(war.faction)}</b> &middot; ${num(war.score)} pts</div>` : "";
    const cards = srv.servants.length
      ? `<div class="grid">${srv.servants.map(servantCard).join("")}</div>`
      : `<div class="empty">No contracted servants yet. Use /summon in Discord.</div>`;
    tab.innerHTML = `<h2>Inventory</h2><div class="chips">${chips}</div>${warLine}
      <h2>Servants (${srv.servants.length})</h2>${cards}`;
  } catch(e){
    if (String(e).includes("unauthorized")){ location.reload(); return; }
    tab.innerHTML = `<div class="note">Could not load your data. ${esc(e.message)}</div>`;
  }
}

async function loadBoards(){
  const tab = $("tab-boards");
  try {
    const [sb, qb] = await Promise.all([api("/api/leaderboard/servants"), api("/api/leaderboard/qp")]);
    const srow = r => `<tr><td class="rank">${r.rank}</td><td>${esc(r.owner)}</td>
      <td>${esc(r.name)} <span class="dim">${stars(r.rarity)}</span></td><td class="r">Lv ${r.level}</td></tr>`;
    const qrow = r => `<tr><td class="rank">${r.rank}</td><td>${esc(r.name)}</td>
      <td class="r">${num(r.points)}</td><td class="r">${num(r.wins)}</td></tr>`;
    tab.innerHTML = `
      <h2>Top servants</h2>
      <table><tr><th class="rank">#</th><th>Owner</th><th>Servant</th><th class="r">Level</th></tr>
        ${sb.leaderboard.map(srow).join("") || `<tr><td colspan="4" class="empty">No entries yet.</td></tr>`}</table>
      <h2>Top QP</h2>
      <table><tr><th class="rank">#</th><th>Player</th><th class="r">QP</th><th class="r">Wins</th></tr>
        ${qb.leaderboard.map(qrow).join("") || `<tr><td colspan="4" class="empty">No entries yet.</td></tr>`}</table>`;
  } catch(e){ tab.innerHTML = `<div class="note">Could not load leaderboards. ${esc(e.message)}</div>`; }
}

async function loadWars(){
  const tab = $("tab-wars");
  try {
    const [active, hist] = await Promise.all([api("/api/wars/active"), api("/api/wars/history")]);
    let html = "<h2>Active war</h2>";
    if (active.active){
      const f = active.factions.map(x=>`<div class="fbar"><span>${esc(x.name)} <span class="dim">(${x.members})</span></span>
        <b>${num(x.score)}</b></div>`).join("");
      html += `<div class="warcard"><div class="name">${esc(active.name)||"Faction War"}</div>
        ${active.description?`<div class="meta">${esc(active.description)}</div>`:""}
        <div class="meta">Ends ${when(active.ends_at)}</div><div style="margin-top:8px">${f}</div></div>`;
    } else { html += `<div class="empty">No war is currently running.</div>`; }
    html += "<h2>Past wars</h2>";
    html += hist.wars.length ? hist.wars.map(w=>`
      <div class="warcard click" data-war="${w.id}">
        <div class="name">${esc(w.name)||"Faction War"}</div>
        <div class="meta">${when(w.started_at)} - ${when(w.ended_at)}</div>
        <div class="dim" id="war-${w.id}"></div>
      </div>`).join("") : `<div class="empty">No past wars yet.</div>`;
    tab.innerHTML = html;
    tab.querySelectorAll(".warcard.click").forEach(el=>{
      el.onclick = async ()=>{
        const id = el.dataset.war, box = $("war-"+id);
        if (box.dataset.loaded){ box.innerHTML = box.dataset.loaded=""; return; }
        const d = await api("/api/wars/"+id);
        const rows = d.factions.map(f=>`<div style="margin-top:6px"><b>${esc(f.name)}</b> &middot; ${num(f.score)} pts
          ${f.members.map(m=>`<div class="fbar"><span>${esc(m.name)}</span><span>${num(m.score)}</span></div>`).join("")}</div>`).join("");
        box.innerHTML = rows; box.dataset.loaded = "1";
      };
    });
  } catch(e){ tab.innerHTML = `<div class="note">Could not load wars. ${esc(e.message)}</div>`; }
}

// ---- tabs ----
const loaders = { me:loadMe, boards:loadBoards, wars:loadWars };
const loaded = {};
function show(tab){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on", s.id==="tab-"+tab));
  if (!loaded[tab]){ loaded[tab]=1; loaders[tab](); }
}
document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>show(b.dataset.tab));

renderAuth(getToken() ? {name:"..."} : null);
show("me");
</script>
</body>
</html>
