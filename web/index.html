<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holmes Bot - Autobattle Kits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="kits">
<div id="topnav"></div>
<header class="page">
  <h1>Autobattle Kits</h1>
  <div class="sub">Every servant's autobattle skill. Filter by class, trigger, or effect.</div>
</header>
<main>
  <div class="filters">
    <input id="q" type="search" placeholder="Search servant or skill...">
    <select id="fClass"><option value="">All classes</option></select>
    <select id="fTrigger"><option value="">All triggers</option></select>
    <select id="fEffect"><option value="">All effects</option></select>
    <span id="count"></span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No kits match those filters.</div>
</main>

<div id="editor" class="modal" hidden>
  <div class="modal-card">
    <div id="ed-body"></div>
    <div class="ed-actions">
      <button id="ed-save" class="btn" hidden>Save</button>
      <button id="ed-revert" class="btn ghost" hidden>Revert to default</button>
      <button id="ed-cancel" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
const TARGET = {self:"self",party:"party",party_others:"allies",enemy:"front enemy",
  all_enemies:"all enemies",random_ally:"random ally",random_enemy:"random enemy",next_ally:"next ally"};
const TRIGGER = {on_enter:"On enter",battle_start:"Battle start",on_kill:"On kill",on_defeat:"On defeat"};

const titleize = s => (s||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const prettyClass = s => (s||"").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/\b\w/g,c=>c.toUpperCase());

function fmtEffect(e){
  const pct = Math.round(e.value*100)+"%", T = e.type;
  const tgt = TARGET[e.target]||e.target;
  const dur = e.duration===-1 ? "perm" : e.duration+"t";
  let label;
  if (["attack_up","defense_up"].includes(T)) label = T.split("_")[0].toUpperCase()+" +"+pct;
  else if (["attack_down","defense_down"].includes(T)) label = T.split("_")[0].toUpperCase()+" -"+pct;
  else if (["curse","burn","poison"].includes(T)) label = titleize(T)+" "+Math.round(e.value);
  else if (T==="heal") label = "Heal "+Math.round(e.value);
  else if (T==="healing_per_turn") label = "Regen "+(e.value<=10?pct:Math.round(e.value));
  else if (T==="max_hp_up") label = "Max HP +"+(e.value<=10?pct:Math.round(e.value));
  else if (["stun","sleep","skill_seal"].includes(T)) label = titleize(T);
  else if (T==="evade") label = "Evade";
  else if (T==="piercing") label = "Pierce "+pct;
  else if (T==="instant_kill") label = "Instant Kill "+pct;
  else if (T==="heal_on_damage") label = "Drain "+Math.round(e.value);
  else if (T==="guts") label = "Guts "+Math.round(e.value);
  else label = titleize(T);
  return `${label} <span class="t">(${tgt}, ${dur})</span>`;
}

let DATA = [];
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let IS_MOD = false;
const authHeaders = () => token() ? {Authorization:"Bearer "+token()} : {};

function fillSelect(sel, values, labeler){
  for (const v of [...new Set(values)].sort())
    sel.insertAdjacentHTML("beforeend", `<option value="${v}">${labeler(v)}</option>`);
}

function render(){
  const q = $("q").value.trim().toLowerCase();
  const c = $("fClass").value, tr = $("fTrigger").value, ef = $("fEffect").value;
  const rows = DATA.filter(r =>
    (!c || r.className===c) &&
    (!tr || r.trigger===tr) &&
    (!ef || r.effects.some(e=>e.type===ef)) &&
    (!q || r.name.toLowerCase().includes(q) || (r.skill||"").toLowerCase().includes(q))
  );
  $("count").textContent = `${rows.length} of ${DATA.length}`;
  $("empty").hidden = rows.length > 0;
  $("grid").innerHTML = rows.map(r => `
    <div class="card">
      ${r.face ? `<img loading="lazy" src="${r.face}" alt="">` : ``}
      <div class="body">
        <div class="name">${r.name} ${r.rarity ? `<span class="stars">${"★".repeat(r.rarity)}</span>` : ``}</div>
        <div class="meta">${prettyClass(r.className)}</div>
        <div><span class="skill">${r.skill||"?"}</span> <span class="trig">${TRIGGER[r.trigger]||r.trigger}</span></div>
        ${r.effects.map(e=>`<div class="eff">${fmtEffect(e)}</div>`).join("")}
        ${IS_MOD ? `<button class="editbtn" data-id="${r.id}">Edit kit</button>` : ``}
      </div>
    </div>`).join("");
}

fetch("./kits.json").then(r=>r.json()).then(data=>{
  DATA = data;
  fillSelect($("fClass"), data.map(r=>r.className).filter(Boolean), prettyClass);
  fillSelect($("fTrigger"), data.map(r=>r.trigger).filter(Boolean), v=>TRIGGER[v]||v);
  fillSelect($("fEffect"), data.flatMap(r=>r.effects.map(e=>e.type)), titleize);
  ["q","fClass","fTrigger","fEffect"].forEach(id=>$(id).addEventListener("input", render));
  render();
  checkMod();
  applyOverrides();
}).catch(()=>{ $("empty").hidden=false; $("empty").textContent="Could not load kits.json (run scripts/build_site_data.py)."; });

// ---- mod-only kit editor (only appears for users in DASHBOARD_MOD_IDS) ----
function checkMod(){
  if (!token()) return;
  fetch(API_BASE+"/api/me", {headers:authHeaders()}).then(r=>r.ok?r.json():null)
    .then(me=>{ if (me && me.can_edit_kits){ IS_MOD = true; render(); } }).catch(()=>{});
}
// Overlay live DB overrides onto the baked kits.json so the cards show the true current kits.
function applyOverrides(){
  fetch(API_BASE+"/api/kits/overrides").then(r=>r.ok?r.json():null).then(d=>{
    if (!d || !d.overrides) return;
    let n = 0;
    for (const [sid, kit] of Object.entries(d.overrides)){
      const row = DATA.find(x=>x.id===parseInt(sid,10));
      if (row){
        row.skill = kit.name; row.trigger = kit.trigger;
        row.effects = (kit.effects||[]).map(e=>({type:e.effect_type, value:e.value, duration:e.duration, target:e.target}));
        n++;
      }
    }
    if (n) render();
  }).catch(()=>{});
}
let EDIT_ID = null, VOCAB = null;
const opttag = (v, sel) => `<option value="${v}" ${v===sel?"selected":""}>${titleize(v)}</option>`;
function effectRow(e){
  e = e || {effect_type:VOCAB.effect_types[0], value:1, duration:-1, target:"self"};
  return `<div class="effrow">
    <select class="e-type">${VOCAB.effect_types.map(t=>opttag(t,e.effect_type)).join("")}</select>
    <input class="e-val" type="number" step="any" value="${e.value}" title="value">
    <input class="e-dur" type="number" step="1" value="${e.duration}" title="duration (-1 = permanent)">
    <select class="e-tgt">${VOCAB.targets.map(t=>opttag(t,e.target)).join("")}</select>
    <label class="e-unrem"><input type="checkbox" ${e.unremovable?"checked":""}> unrem</label>
    <button class="e-del" title="remove effect">&times;</button>
  </div>`;
}
async function openEditor(sid){
  const box = $("editor"), body = $("ed-body");
  box.hidden = false; body.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  $("ed-save").hidden = $("ed-revert").hidden = true;
  try{
    const r = await fetch(API_BASE+"/api/kits/"+sid, {headers:authHeaders()});
    if (!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json(); VOCAB = d.vocab; EDIT_ID = sid;
    const k = d.kit || {name:"", trigger:VOCAB.triggers[0], description:"", effects:[]};
    body.innerHTML = `
      <div class="ed-title">${esc(d.servant_name)} <span class="dim">#${sid}</span></div>
      <label class="fld">Skill name<input id="ed-name" value="${esc(k.name||"")}"></label>
      <label class="fld">Trigger<select id="ed-trigger">${VOCAB.triggers.map(t=>opttag(t,k.trigger)).join("")}</select></label>
      <label class="fld">Description<input id="ed-desc" value="${esc(k.description||"")}"></label>
      <div class="fld">Effects</div>
      <div id="ed-effects">${(k.effects||[]).map(effectRow).join("")}</div>
      <button id="ed-add" class="ghostbtn">+ Add effect</button>
      <div id="ed-err" class="ed-err"></div>`;
    $("ed-add").onclick = ()=> $("ed-effects").insertAdjacentHTML("beforeend", effectRow());
    $("ed-save").hidden = false;
    $("ed-revert").hidden = !d.has_override;
  }catch(e){ body.innerHTML = `<div class="errbox">Couldn't load kit. ${esc(e.message)}</div>`; }
}
function gatherKit(){
  const effects = [...document.querySelectorAll("#ed-effects .effrow")].map(row=>{
    const o = { effect_type: row.querySelector(".e-type").value,
      value: parseFloat(row.querySelector(".e-val").value),
      duration: parseInt(row.querySelector(".e-dur").value,10),
      target: row.querySelector(".e-tgt").value };
    if (row.querySelector(".e-unrem input").checked) o.unremovable = true;
    return o;
  });
  return { id: EDIT_ID, name: $("ed-name").value.trim(), trigger: $("ed-trigger").value,
    description: $("ed-desc").value.trim(), effects };
}
function patchLocal(kit){
  const row = DATA.find(x=>x.id===EDIT_ID);
  if (!row) return;
  row.skill = kit.name; row.trigger = kit.trigger;
  row.effects = (kit.effects||[]).map(e=>({type:e.effect_type, value:e.value, duration:e.duration, target:e.target}));
}
async function saveKit(){
  const kit = gatherKit(), err = $("ed-err"); err.textContent = "";
  try{
    const r = await fetch(API_BASE+"/api/kits/"+EDIT_ID, {method:"PUT",
      headers:{...authHeaders(), "Content-Type":"application/json"}, body: JSON.stringify(kit)});
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.ok){ err.textContent = "Rejected: " + ((d.errors||[]).join("; ") || ("HTTP "+r.status)); return; }
    patchLocal(kit); closeEditor(); render();
  }catch(e){ err.textContent = "Error: " + e.message; }
}
async function revertKit(){
  const err = $("ed-err"); err.textContent = "";
  try{
    const r = await fetch(API_BASE+"/api/kits/"+EDIT_ID, {method:"DELETE", headers:authHeaders()});
    if (!r.ok) throw new Error("HTTP "+r.status);
    const d = await (await fetch(API_BASE+"/api/kits/"+EDIT_ID, {headers:authHeaders()})).json();
    if (d.kit) patchLocal({name:d.kit.name, trigger:d.kit.trigger, effects:d.kit.effects});
    closeEditor(); render();
  }catch(e){ err.textContent = "Error: " + e.message; }
}
function closeEditor(){ $("editor").hidden = true; EDIT_ID = null; }

$("grid").addEventListener("click", e=>{
  const b = e.target.closest(".editbtn"); if (b) openEditor(parseInt(b.dataset.id,10));
});
$("editor").addEventListener("click", e=>{
  if (e.target.id === "editor") closeEditor();
  if (e.target.classList.contains("e-del")) e.target.closest(".effrow").remove();
});
$("ed-save").onclick = saveKit;
$("ed-revert").onclick = revertKit;
$("ed-cancel").onclick = closeEditor;
</script>
</body>
</html>
